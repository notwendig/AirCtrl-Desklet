name: Draft source release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      QT_QPA_PLATFORM: offscreen
      XDG_CONFIG_HOME: ${{ runner.temp }}/airctrl-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        run: |
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          test "$TAG_NAME" = "v$(python3 scripts/check_repository.py --version)"
          test -f "docs/releases/$TAG_NAME.md"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev qt6-svg-dev libssl-dev nlohmann-json3-dev python3 fonts-dejavu-core dbus
      - name: Build and verify
        run: |
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests -p 'test_repository.py' -v
          cmake --preset ci -DAIRCTRL_TEST_WITH_DBUS=ON
          cmake --build --preset ci --parallel 2
          ctest --preset ci
          cmake --install build/ci --prefix "$RUNNER_TEMP/airctrl-install"
          "$RUNNER_TEMP/airctrl-install/bin/airctrl-desklet" --version
          "$RUNNER_TEMP/airctrl-install/bin/airctrl-desklet" --screenshot "$RUNNER_TEMP/desklet-demo.png"
          test -s "$RUNNER_TEMP/desklet-demo.png"
          python3 scripts/package_source.py
      - name: Create draft (never publish or overwrite automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG_NAME" \
            "dist/AirCtrl-Desklet-${TAG_NAME#v}.zip" \
            "dist/AirCtrl-Desklet-${TAG_NAME#v}.zip.sha256" \
            --verify-tag --draft --title "AirCtrl-Desklet $TAG_NAME" \
            --notes-file "docs/releases/$TAG_NAME.md"
