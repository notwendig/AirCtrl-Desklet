name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-without-qt:
    name: Ubuntu 24.04 / server without Qt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install server-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libssl-dev nlohmann-json3-dev
      - name: Build with Qt discovery disabled
        run: |
          cmake --preset release-server -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
          cmake --build --preset release-server --parallel 2
          ./build/RELEASE/server/airctrl-server --check-config --config config/airctrld.cfg
          if ldd ./build/RELEASE/server/airctrl-server | grep -q Qt; then exit 1; fi

  ubuntu:
    name: Ubuntu 24.04 / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      QT_QPA_PLATFORM: offscreen
      XDG_CONFIG_HOME: ${{ runner.temp }}/airctrl-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build qt6-base-dev qt6-svg-dev libssl-dev nlohmann-json3-dev python3 fonts-dejavu-core dbus
      - name: Check repository and packaging
        run: |
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests -p 'test_repository.py' -v
          python3 scripts/package_source.py
          bash -n install.sh uninstall.sh
      - name: Configure, build and test
        run: |
          cmake --preset release-server
          cmake --build --preset release-server --parallel 2
          cmake --preset release-client -DAIRCTRL_TEST_WITH_DBUS=ON
          cmake --build --preset release-client --parallel 2
          ctest --preset release-client
      - name: Install and render demo without a device
        run: |
          cmake --install build/RELEASE/server --prefix "$RUNNER_TEMP/airctrl-install"
          cmake --install build/RELEASE/client --prefix "$RUNNER_TEMP/airctrl-install"
          "$RUNNER_TEMP/airctrl-install/bin/airctrl-desklet" --version
          "$RUNNER_TEMP/airctrl-install/bin/airctrl-desklet" --screenshot "$RUNNER_TEMP/desklet-demo.png"
          test -s "$RUNNER_TEMP/desklet-demo.png"
          ./build/RELEASE/client/diagnostics-preview "$RUNNER_TEMP/diagnostics-demo.png"
          test -s "$RUNNER_TEMP/diagnostics-demo.png"
      - name: Save test logs and demo
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-${{ matrix.compiler }}-test-results
          path: |
            build/RELEASE/client/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/desklet-demo.png
            ${{ runner.temp }}/diagnostics-demo.png
          if-no-files-found: ignore
          retention-days: 14

  fedora:
    name: Fedora 44 / GCC
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      XDG_CONFIG_HOME: /tmp/airctrl-ci-config
    steps:
      - name: Install build dependencies
        run: dnf install -y git gcc-c++ cmake ninja-build qt6-qtbase-devel qt6-qtsvg openssl-devel json-devel python3 dejavu-sans-fonts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository and packaging
        run: |
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests -p 'test_repository.py' -v
          bash -n install.sh uninstall.sh
      - name: Configure, build and test
        run: |
          cmake --preset release-server
          cmake --build --preset release-server --parallel 2
          cmake --preset release-client
          cmake --build --preset release-client --parallel 2
          ctest --preset release-client
      - name: Install and render demo without a device
        run: |
          cmake --install build/RELEASE/server --prefix /tmp/airctrl-ci-install
          cmake --install build/RELEASE/client --prefix /tmp/airctrl-ci-install
          /tmp/airctrl-ci-install/bin/airctrl-desklet --version
          /tmp/airctrl-ci-install/bin/airctrl-desklet --screenshot /tmp/airctrl-ci-demo.png
          test -s /tmp/airctrl-ci-demo.png
          ./build/RELEASE/client/diagnostics-preview /tmp/airctrl-ci-diagnostics.png
          test -s /tmp/airctrl-ci-diagnostics.png
      - name: Save test logs and demo
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-gcc-test-results
          path: |
            build/RELEASE/client/Testing/Temporary/LastTest.log
            /tmp/airctrl-ci-demo.png
            /tmp/airctrl-ci-diagnostics.png
          if-no-files-found: ignore
          retention-days: 14
