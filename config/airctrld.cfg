[server]
# 0.0.0.0 erlaubt Clients aus dem lokalen Netz. Die Firewall muss TCP 5680
# nur fuer vertrauenswuerdige Rechner freigeben.
listen_address=0.0.0.0
port=5680

[logging]
# Jede gültige Statusmeldung wird als CSV-Zeile angehängt.
status_file=/var/log/airctrl.log

[automation]
# Die Lua-Laufzeit und das maßgebliche Skript liegen ausschließlich auf dem
# Server. Ohne explizite Pfade werden diese Dateien im Benutzer-Konfigurations-
# ordner des airctrl-server-Dienstes gespeichert:
#   ~/.config/airctrl-server/automation.lua
#   ~/.config/airctrl-server/automation-state.json
# script_file=/home/user/.config/airctrl-server/automation.lua
# state_file=/home/user/.config/airctrl-server/automation-state.json
# Gilt nur, solange noch keine Zustandsdatei existiert. Danach wird die im
# Client-Editor gespeicherte Aktivierung serverseitig beibehalten.
enabled=false

[device]
# Diese Werte kennt ausschliesslich airctrl-server.
host=AC2729-10
port=5683
# Fester lokaler UDP-Port fuer eine enge Firewall-Regel. 0 = dynamisch.
local_port=5680
reconnect_ms=10000
request_ms=60000
initial_status_ms=120000
idle_ms=90000
keepalive_ms=20000
observe_refreshes=1
cancel_grace_ms=300
